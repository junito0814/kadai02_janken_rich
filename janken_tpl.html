<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<script src="js/jquery-2.1.3.min.js"></script>
<link rel="stylesheet" href="css/sample.css">
<title>じゃんけん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
</head>
<body>

<header>
  <h1 id="head">心理じゃんけん</h1>
</header>

<main>
  <div class="gameArea">
    <div class="cpu">CPU：<span id="cpu" >最初は✊じゃんけん</span></div>

    <ul>
      <li id="gu_btn" class="btn">✊</li>
      <li id="cho_btn" class="btn">✌️</li>
      <li id="par_btn" class="btn">🖐️</li>
    </ul>

    <div id = "player" class="player"></div>
    <div id="timer" class="timer"></div>
    <div id="judgment" class="judgment">あなた</div>
    <div id="history" class="history">戦績</div>
    <button id="reset">リセット</button>
  </div>

  <div class="board-wrap">
    <div id="lane-p"></div>
    <div id="nums"></div>
    <div id="lane-c"></div>
  </div>

</main>

<footer></footer>
<script>
//じゃんけん用のSCRIPTを書いてください
  let player = 0;
  let timerInterval = null;  

  const GOAL = 20;
  let posP = 0;
  let posC = 0;
  let gameOver = false;

  let winCount = 0;
  let loseCount = 0;
  let drawCount = 0; 
  

  function buildBoard(){
    let htmlP = '';
    let htmlC = '';
    let htmlN = '';


  for (let i = GOAL; i >= 0; i--) {
      let label;
      if (i === GOAL){
        label = "GOAL";
      }else if (i === 0){
        label = "START";
      }else {
        label = i;
      }



      let clsP = 'step' + (i === GOAL ? ' goal' : '');  
      let markP = '';
      if (i === posP) {
        clsP += ' current-p';  
        markP = '⭐️';
      } else if (i < posP) {
        clsP += ' passed-p';   
      }
      htmlP += `<div class="${clsP}">${markP}</div>`;
      htmlN += `<div class="snum">${label}</div>`;  

      let clsC = 'step';
      let markC = '';
      if (i === posC) {
        clsC += ' current-c'; 
        markC = '▲';
      } else if (i < posC) {
        clsC += ' passed-c';   
      }
      htmlC += `<div class="${clsC}">${markC}</div>`;
    }
    $("#lane-p").html(htmlP);
    $("#nums").html(htmlN);
    $("#lane-c").html(htmlC);
  }

  function setButtons(disabled){
    if (disabled){
      $(".btn").addClass('disabled');
    }else {
      $(".btn").removeClass('disabled');
    }
  }

  $("#gu_btn").on("click", function () {
    player = '✊';
    $("#player").html('あなた：✊');
    startTimerIfNeeded();
  });

  $("#cho_btn").on("click", function () {
    player = '✌️';
    $("#player").html('あなた：✌️');
    startTimerIfNeeded();
  });

  $("#par_btn").on("click", function () {
    player = '🖐️';
    $("#player").html('あなた：🖐️');
    startTimerIfNeeded();
  });

  function startTimerIfNeeded() {
    if (timerInterval !== null) return; 

    $("#judgment").html('');
    showHint();

    function showHint(){
      const hints = ['✊を出してるよ','✌️を出してるよ','🖐️を出してるよ',
        '✌️を🖐️に変えようかな','✌️を✊に変えようかな',
        '🖐️を✌️に変えようかな','🖐️を✊に変えようかな',
        '✊を✌️に変えようかな','✊を🖐️に変えようかな'
      ];
    const q = Math.floor(Math.random() * hints.length);
    $("#cpu").html(hints[q]);
    }

    let time = 5;
    $("#timer").html(time);

    timerInterval = setInterval(function () {
      time--;
      $("#timer").html(time);

      if (time == 0) {
        clearInterval(timerInterval);
        timerInterval = null; 
        showResult();
      }
    }, 1000);
  }

  function showResult() {
    const a = Math.ceil(Math.random() * 3);
    const hands = ['✊', '✌️',  '🖐️'];
    const cpu = a; 

    let cpuHand;
    if (a == 1) cpuHand = '✊';
    else if (a == 2) cpuHand = '✌️';
    else cpuHand = '🖐️';

    $("#cpu").html(cpuHand);

    const win = (player == '✊' && cpuHand == '✌️') ||
      (player == '✌️' && cpuHand == '🖐️') ||
      (player == '🖐️' && cpuHand == '✊');
    const draw = player === cpuHand;

    if (draw) {
      $("#judgment").html('あいこ');
      drawCount++;
    } else if (win) {
      $("#judgment").html('勝ち！');
      winCount++;
      if (player == '✊') posP += 1;
      else if (player == '✌️') posP += 3;
      else if (player =='🖐️') posP +=5;
    } else {
      $("#judgment").html('負け...');
      loseCount++;
      if (cpuHand == '✊') posC += 1;
      else if (cpuHand == '✌️') posC += 3;  
      else if (cpuHand == '🖐️') posC += 5;
    }

    buildBoard(); 

    if (posP >= GOAL) {
      $("#judgment").html('🎉 プレイヤーの勝利！');
      setButtons(true);
      gameOver = true;
    } else if (posC >= GOAL) {
      $("#judgment").html('💀 CPUの勝利...');
      setButtons(true);
      gameOver = true;
    }
 
      $("#timer").html('');
        const total = winCount + loseCount + drawCount;
        const winRate = Math.floor((winCount / total) * 100);
      $("#history").html(`勝ち:${winCount} 負け:${loseCount} あいこ:${drawCount} 勝率:${winRate}%`);
  }

    $('#reset').on('click', function () {
        clearInterval(timerInterval); 
        timerInterval = null;
        posP = posC = 0;
        player = '';
        gameOver = false;
        winCount = loseCount = drawCount = 0;

        $('#player').html('');
        $('#cpu').html('最初は✊じゃんけん');
        $('#timer').html('');
        $('#judgment').html('手を選んでスタート！');

        setButtons(false); 
        buildBoard();      
      });

        buildBoard();

</script>
</body>
</html>
